<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Rain Taxi 夜雨タクシー</title>
<style>
:root{
  --amber:#ffb23e; --cyan:#5ee7ff; --pink:#ff3d8b; --ink:#04060b; --paper:#e9f2f5;
  --ui:"Bahnschrift","DIN Alternate","Avenir Next Condensed","Segoe UI",system-ui,sans-serif;
  --jp:"Yu Gothic UI","Yu Gothic","Meiryo","Hiragino Sans","Noto Sans CJK JP","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ink);color:var(--paper);font-family:var(--ui);overflow:hidden}
body.nocursor,body.nocursor *{cursor:none!important}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.jp{font-family:var(--jp)}
#hud{position:fixed;inset:0;pointer-events:none;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .5s}
#hud.on{opacity:1}
#plate{position:absolute;left:22px;top:20px;display:flex;gap:14px;align-items:stretch}
#lamp{font-family:var(--jp);font-weight:900;font-size:34px;line-height:1;padding:10px 12px 12px;letter-spacing:.06em;
  color:#1a0d00;background:var(--amber);border-radius:3px;box-shadow:0 0 26px rgba(255,178,62,.55),inset 0 0 0 2px rgba(255,255,255,.25);
  transition:background .3s,box-shadow .3s,color .3s}
#lamp.call{background:var(--cyan);color:#001318;box-shadow:0 0 26px rgba(94,231,255,.55),inset 0 0 0 2px rgba(255,255,255,.3)}
#lamp.hired{background:var(--pink);color:#fff;box-shadow:0 0 26px rgba(255,61,139,.6),inset 0 0 0 2px rgba(255,255,255,.25)}
#meter{display:flex;flex-direction:column;justify-content:center;text-shadow:0 0 12px rgba(0,0,0,.9)}
#lampEn{font-size:13px;opacity:.8;letter-spacing:.04em}
#fare{font-size:26px;font-weight:700;color:var(--amber);text-shadow:0 0 14px rgba(255,178,62,.5)}
#stars{font-size:14px;letter-spacing:.12em;color:var(--pink);min-height:18px}
#job{position:absolute;left:50%;top:18px;transform:translateX(-50%);text-align:center;text-shadow:0 0 10px #000,0 0 2px #000;max-width:70vw}
#clock{font-size:44px;font-weight:700;line-height:1;color:var(--paper)}
#clock.low{color:var(--pink);text-shadow:0 0 18px rgba(255,61,139,.8)}
#jobText{font-size:17px;margin-top:4px}
#jobJp{font-size:13px;opacity:.75}
#strikes{font-size:14px;margin-top:5px;color:var(--pink);letter-spacing:.1em}
#gauges{position:absolute;left:22px;bottom:20px;text-shadow:0 0 10px #000}
#speed{font-size:54px;font-weight:700;line-height:.9}
#speed small,#alt small{font-size:14px;font-weight:400;opacity:.7;margin-left:4px}
#alt{font-size:20px;margin-top:6px;color:var(--cyan)}
#hpBar{position:absolute;left:0;top:0;width:96px;margin:-38px 0 0 -48px;opacity:0;transition:opacity .6s}
#hpBar .trk{position:relative;height:7px;border-radius:4px;background:rgba(0,0,0,.6);box-shadow:0 0 0 1px rgba(255,255,255,.3);overflow:hidden}
#hpBar .trk i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
#hpBar .lag{background:#fff;opacity:.7}
#hpBar .fill{background:var(--amber);box-shadow:0 0 10px var(--amber)}
#hpBar.low .fill{background:var(--pink);box-shadow:0 0 10px var(--pink)}
#hpBar span{display:block;text-align:center;font-size:12px;font-weight:700;margin-top:3px;text-shadow:0 0 6px #000,0 0 2px #000}
#hull{font-size:20px;margin-top:4px;font-weight:700;color:var(--amber)}
#hull.low{color:var(--pink);text-shadow:0 0 14px rgba(255,61,139,.8)}
#hull:empty{display:none}
#total{position:absolute;right:220px;bottom:20px;text-align:right;text-shadow:0 0 10px #000}
#edgeGlow{position:fixed;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 140px 30px rgba(255,90,40,.55)}
#edgeWarn{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font-size:20px;font-weight:700;color:#ffb23e;text-shadow:0 0 12px rgba(255,120,30,.8),0 0 3px #000;opacity:0;white-space:nowrap}
#mini{position:absolute;right:22px;bottom:20px;width:180px;height:180px}
#threats i{position:absolute;left:0;top:0;width:0;height:0;margin:-9px 0 0 -11px;border-left:11px solid transparent;border-right:11px solid transparent;
  border-bottom:19px solid currentColor;opacity:0;filter:drop-shadow(0 0 7px currentColor);transition:opacity .2s}
#threats i.hot{animation:hot .3s infinite alternate}
@keyframes hot{to{filter:drop-shadow(0 0 16px currentColor) brightness(1.7)}}
@media (prefers-reduced-motion:reduce){#threats i.hot{animation:none}}
#totalYen{font-size:30px;font-weight:700;color:var(--amber)}
#totalLbl,#padState{font-size:13px;opacity:.75}
#endBanner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .25s;
  background:radial-gradient(ellipse at center,rgba(3,5,10,.55) 0,rgba(3,5,10,0) 60%)}
#endBanner.on{opacity:1}
#endBig{font-size:clamp(48px,8vw,104px);font-weight:700;letter-spacing:.04em;color:var(--amber);text-shadow:0 0 28px rgba(255,178,62,.8),0 0 4px #000;text-transform:uppercase}
#endBanner.wreck #endBig{color:var(--pink);text-shadow:0 0 30px rgba(255,61,139,.9),0 0 4px #000}
#endSub{font-size:22px;margin-top:8px;text-shadow:0 0 10px #000,0 0 2px #000}
#toast{position:absolute;left:50%;top:162px;transform:translateX(-50%);font-size:22px;font-weight:600;text-align:center;
  text-shadow:0 0 14px #000,0 0 3px #000;opacity:0;transition:opacity .25s;white-space:nowrap}
#toast.on{opacity:1}
#board{position:absolute;left:50%;top:62%;width:220px;height:6px;margin-left:-110px;background:rgba(255,255,255,.14);border-radius:3px;opacity:0;transition:opacity .2s}
#board i{display:block;height:100%;width:0;background:var(--cyan);border-radius:3px;box-shadow:0 0 12px var(--cyan)}
#mark{position:absolute;left:0;top:0;width:0;height:0}
#mark b{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border:2px solid var(--cyan);transform:rotate(45deg);box-shadow:0 0 12px var(--cyan),inset 0 0 8px rgba(94,231,255,.5)}
#mark.drop b{border-color:var(--pink);box-shadow:0 0 12px var(--pink),inset 0 0 8px rgba(255,61,139,.5)}
#mark span{position:absolute;top:18px;left:-60px;width:120px;text-align:center;font-size:14px;font-weight:600;text-shadow:0 0 8px #000,0 0 2px #000}

/* title screen and menus: one quiet column on the left, the city does the rest */
#bars i{position:fixed;left:0;right:0;height:0;background:#000;transition:height .7s cubic-bezier(.2,.7,.2,1)}
#bars i:first-child{top:0}
#bars i:last-child{bottom:0}
#bars.on i{height:7vh}
#ui{position:fixed;inset:0;display:none;align-items:center;
  background:linear-gradient(90deg,rgba(3,5,10,.92) 0,rgba(3,5,10,.66) 32%,rgba(3,5,10,.08) 64%,rgba(3,5,10,0) 100%)}
#ui.on{display:flex}
#ui{align-items:safe center;overflow-y:auto;padding:7vh 0}
#uiCol{margin-left:7vw;width:min(540px,86vw);display:flex;flex-direction:column}
#logo{display:flex;gap:26px;align-items:flex-end;margin-bottom:5.5vh}
.blade{writing-mode:vertical-rl;font-family:var(--jp);font-weight:900;font-size:clamp(26px,4.6vh,44px);letter-spacing:.1em;line-height:1;
  color:#fff;text-shadow:0 0 6px #fff,0 0 20px var(--pink),0 0 54px var(--pink);border:2px solid var(--pink);padding:16px 9px;border-radius:5px;
  box-shadow:0 0 22px rgba(255,61,139,.6),inset 0 0 20px rgba(255,61,139,.35);animation:buzz 7s infinite}
@keyframes buzz{0%,91%,94%,100%{opacity:1}92%,93%{opacity:.55}}
h1{font-size:clamp(44px,6.4vw,84px);font-weight:700;margin:0;letter-spacing:-.02em;line-height:.9}
#tag{margin:14px 0 0;font-size:17px;opacity:.68}
#uiHead{font-size:clamp(30px,4vw,50px);margin:0 0 2.6vh;font-weight:700;letter-spacing:-.01em}
#uiStats p{font-size:20px;margin:0 0 4px}
#uiStats p b{color:var(--amber);font-size:32px}
#uiStats{margin-bottom:2.4vh}
#uiStats:empty,#uiPane:empty,#uiHead:empty{display:none}
#ui[data-menu="main"] #uiHead{display:none}
#ui:not([data-menu="main"]) #logo{display:none}
.item{appearance:none;background:none;border:0;border-left:3px solid transparent;font:inherit;text-align:left;width:100%;
  display:flex;align-items:center;justify-content:space-between;gap:20px;font-size:23px;font-weight:600;padding:9px 0 9px 18px;
  color:rgba(233,242,245,.58);cursor:pointer;transition:padding .12s,color .12s}
.item.sel{color:#fff;border-left-color:var(--amber);padding-left:28px;text-shadow:0 0 18px rgba(255,178,62,.5)}
.item:focus-visible{outline:2px solid #fff;outline-offset:2px}
.item .val{font-size:17px;font-weight:400;color:var(--amber);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{display:inline-block;width:120px;height:4px;margin-right:12px;background:rgba(255,255,255,.18);vertical-align:middle;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--amber)}
#uiHint{min-height:44px;margin:14px 0 0 21px;font-size:15px;line-height:1.45;opacity:.72;max-width:46ch}
#uiPane{margin:0 0 2vh 21px}
#uiPane table{border-collapse:collapse;font-size:16px;line-height:1.3}
#uiPane th{font-weight:600;text-align:left;padding:0 26px 8px 0;color:var(--cyan)}
#uiPane td{padding:4px 26px 4px 0;vertical-align:top}
#uiPane td:first-child{opacity:.6}
#uiKeys{margin:14px 0 0 21px;font-size:13px;opacity:.62;min-height:22px}
.dense .item{font-size:20px;padding:6px 0 6px 18px}
.dense .item.sel{padding-left:28px}
.dense #uiHint{min-height:24px;margin-top:10px}
#uiKeys b{display:inline-block;border:1px solid rgba(255,255,255,.55);border-radius:4px;padding:1px 7px;margin:0 7px 0 18px;font-weight:600}
#uiKeys b:first-child{margin-left:0}
#uiKeys .gp{margin:0 7px 0 18px}
#uiKeys .gp:first-child{margin-left:0}
.gp{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:50%;vertical-align:middle;
  font:700 12px/1 var(--ui);color:#fff;background:rgba(0,0,0,.65);border:2px solid currentColor;box-shadow:0 0 8px -2px currentColor}
.gp.sh{border-radius:7px;padding:0 6px;color:#d9e2e8;font-size:11px}
.gp.st{color:#d9e2e8}
.gp.dp{color:#d9e2e8;border-radius:5px;font-size:14px}
#uiPane .gp{margin-right:4px}
/* high scores */
.ini3{display:flex;gap:14px;margin:6px 0 4px}
.ini3 span{width:64px;height:80px;display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:700;
  border-bottom:3px solid rgba(255,255,255,.25);color:rgba(233,242,245,.6)}
.ini3 span.cur{color:#fff;border-bottom-color:var(--amber);text-shadow:0 0 20px rgba(255,178,62,.65)}
table.hs{border-collapse:collapse;font-size:17px;font-variant-numeric:tabular-nums;min-width:330px}
#uiPane table.hs td{padding:3px 20px 3px 0}
table.hs td.n{width:26px}
table.hs .ini{font-weight:700;letter-spacing:.14em}
table.hs .yen{color:var(--amber);text-align:right}
table.hs .dif{font-size:13px;opacity:.55}
table.hs tr.me td{opacity:1;color:#fff;text-shadow:0 0 14px rgba(255,178,62,.85)}
table.hs tr.me .ini,table.hs tr.me .yen{color:var(--amber)}
.hsEmpty,.hsNote{font-size:14px;opacity:.68;margin:6px 0 0;max-width:44ch;line-height:1.4}
#fade{position:fixed;inset:0;background:#000;pointer-events:none;opacity:1;transition:opacity 1.8s ease-out}
#fade.out{opacity:0}
@media (prefers-reduced-motion:reduce){.blade{animation:none}.item,#bars i{transition:none}#fade{transition:opacity .2s}}
@media (max-height:620px){#logo{margin-bottom:3vh}.item{font-size:19px;padding:6px 0 6px 18px}#uiPane table{font-size:14px}}
#fatal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;font-size:18px;line-height:1.5;z-index:5}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="plate">
    <div id="lamp">空車</div>
    <div id="meter"><div id="lampEn">Vacant</div><div id="fare">¥0</div><div id="stars"></div></div>
  </div>
  <div id="job"><div id="clock"></div><div id="jobText"></div><div id="jobJp" class="jp"></div><div id="strikes"></div></div>
  <div id="gauges"><div id="speed">0<small>km/h</small></div><div id="alt">0<small>m altitude</small></div><div id="hull"></div></div>
  <div id="total"><div id="padState"></div><div id="totalLbl">Tonight</div><div id="totalYen">¥0</div></div>
  <div id="edgeGlow"></div><div id="edgeWarn"></div>
  <canvas id="mini" width="180" height="180"></canvas>
  <div id="threats"><i></i><i></i><i></i><i></i></div>
  <div id="mark"><b></b><span></span></div>
  <div id="hpBar"><div class="trk"><i class="lag"></i><i class="fill"></i></div><span></span></div>
  <div id="board"><i></i></div>
  <div id="toast"></div>
  <div id="endBanner"><div id="endBig"></div><div id="endSub"></div></div>
</div>

<div id="bars"><i></i><i></i></div>
<div id="ui">
  <div id="uiCol">
    <div id="logo">
      <div class="blade">夜雨タクシー</div>
      <div><h1>Night Rain Taxi</h1><p id="tag">One cab, one city, and rain that never stops.</p></div>
    </div>
    <h2 id="uiHead"></h2>
    <div id="uiStats"></div>
    <div id="uiPane"></div>
    <div id="uiList"></div>
    <p id="uiHint"></p>
    <div id="uiKeys"></div>
  </div>
</div>
<div id="fade"></div>
<div id="fatal"></div>

<script>
"use strict";
(function(){
const $=id=>document.getElementById(id);
const canvas=$('gl');
const gl=canvas.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
if(!gl){const f=$('fatal');f.style.display='flex';f.textContent='This game needs WebGL 2. Try a current version of Chrome, Edge or Firefox with hardware acceleration turned on.';$('fade').style.display='none';return;}
const hasFloat=!!gl.getExtension('EXT_color_buffer_float');

// ------------------------------------------------------------------ constants
const C=96, N=30, HALF=N*C/2, CEIL=235, FLOOR=4, PLAY=HALF-3*C;
const BANDS_X=[40,70,100,130,160,190,220];   // traffic that moves along x (streets at constant z)
const BANDS_Z=[55,85,115,145,175,205];       // traffic that moves along z (streets at constant x)
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const R=mulberry(20261116);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;

// ------------------------------------------------------------------ shaders
const COMMON=`#version 300 es
precision highp float;
#define HALF ${HALF.toFixed(1)}
#define CELL ${C.toFixed(1)}
uniform vec3 uCam; uniform float uTime, uFlash, uMirror;
float hash11(float p){p=fract(p*.1031);p*=p+33.33;p*=p+p;return fract(p);}
float hash21(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x),f.y);}
vec3 neonPal(float h){h=fract(h)*6.;
  if(h<1.)return vec3(1.,.10,.42); if(h<2.)return vec3(.05,.80,1.); if(h<3.)return vec3(1.,.50,.06);
  if(h<4.)return vec3(.50,.26,1.); if(h<5.)return vec3(1.,.16,.12); return vec3(.15,1.,.65);}
vec3 hazeColor(vec3 d){
  vec3 low=vec3(.150,.060,.085), mid=vec3(.026,.058,.088), top=vec3(.004,.008,.016);
  vec3 c=mix(low,mid,smoothstep(-.04,.30,d.y)); c=mix(c,top,smoothstep(.22,.95,d.y));
  c=mix(c,vec3(.085,.036,.060),smoothstep(0.,-.55,d.y));
  return c;}
vec3 applyFog(vec3 col,vec3 wp,float keep){
  vec3 d=wp-uCam; float dist=length(d);
  float hA=max((abs(uCam.y)+wp.y)*.5,0.);
  float dens=.0010+.0030*exp(-hA/55.);
  float f=1.-exp(-dist*dens);
  vec3 fc=hazeColor(d/max(dist,.001))+uFlash*vec3(.09,.12,.19);
  return mix(col,fc,f*keep);}
`;
const VS_HEAD=`#version 300 es
precision highp float;
#define HALF ${HALF.toFixed(1)}
uniform mat4 uVP; uniform vec3 uCam; uniform float uTime, uMirror;
`;

const BOX_VS=VS_HEAD+`
layout(location=0) in vec3 aV; layout(location=1) in vec3 aNrm;
layout(location=2) in vec3 aPos; layout(location=3) in vec3 aSize; layout(location=4) in vec4 aData;
layout(location=5) in vec3 aColor; layout(location=6) in vec4 aMove;
uniform mat4 uModel;
out vec3 vW; out vec3 vN; out vec3 vL; flat out vec4 vData; flat out vec3 vColor; flat out vec3 vSize;
void main(){
  vec3 c=aPos;
  if(aMove.x>.5){float s=mod(aMove.y+aMove.z*uTime+HALF,2.*HALF)-HALF; if(aMove.x<1.5)c.x=s; else c.z=s;}
  float cy=cos(aData.z), sy=sin(aData.z);
  vec3 l=aV*aSize;
  vec3 r=vec3(l.x*cy+l.z*sy,l.y,-l.x*sy+l.z*cy);
  vec3 an=normalize(aNrm/aSize);
  vec3 n=vec3(an.x*cy+an.z*sy,an.y,-an.x*sy+an.z*cy);
  vec4 w=uModel*vec4(r+c,1.);
  vW=w.xyz; vN=mat3(uModel)*n; vL=l; vData=aData; vColor=aColor; vSize=aSize;
  gl_Position=uVP*vec4(w.x,w.y*uMirror,w.z,1.);
}`;
const BOX_FS=COMMON+`
in vec3 vW; in vec3 vN; in vec3 vL; flat in vec4 vData; flat in vec3 vColor; flat in vec3 vSize;
out vec4 o;
void main(){
  float seed=vData.x, kind=vData.y;
  if(kind>2.5){ o=vec4(applyFog(vColor*vData.w,vW,.8),1.); return; }
  vec3 Nn=normalize(vN), V=normalize(uCam-vW), Rf=reflect(-V,Nn);
  float fres=pow(1.-max(dot(Nn,V),0.),4.);
  vec3 env=hazeColor(Rf);
  vec3 col;
  if(kind>1.5){
    // car paint: gloss that picks up whatever neon the car is flying past
    float nf=hash21(floor(vW.xz/26.))+floor(vW.y/40.)*.37;
    vec3 neon=neonPal(nf)*(.25+.75*vnoise(vW.xz*.11+uTime*.3));
    col=vColor*(.05+.16*max(Nn.y,0.)+.10*max(dot(Nn,normalize(vec3(.3,.6,.5))),0.));
    col+=env*(.5+2.2*fres)+neon*(.05+.55*fres)*(.4+.6*abs(Nn.y+.2));
    col+=vColor*neon*.10;
    col+=neonPal(seed*9.)*pow(1.-max(dot(Nn,V),0.),2.2)*vData.w;   // coloured rim so traffic reads against the towers
  } else if(kind>.5){
    col=vec3(.012,.014,.02)+env*(.2+fres);
  } else if(abs(Nn.y)>.5){
    float pud=smoothstep(.42,.68,vnoise(vW.xz*.13+seed*7.));
    col=vec3(.008,.010,.014)+env*(.25+.9*pud)*(.35+fres);
    vec2 e=vSize.xz-abs(vL.xz); float edge=min(e.x,e.y);
    if(Nn.y>0.){
      col+=neonPal(seed*3.7)*smoothstep(1.1,.15,edge)*step(.55,hash11(seed*9.1))*.9;
      vec2 rg=vW.xz/3.1+vec2(hash11(seed)*7.,0.), rc=floor(rg); float rh=hash21(rc+seed*3.);
      vec2 rf=fract(rg)-.5-(vec2(rh,hash21(rc+9.))-.5)*.5;
      float rt=fract(uTime*(.7+rh*.8)+rh*9.);
      float ring=smoothstep(.06,0.,abs(length(rf)-rt*.34))*(1.-rt)*step(.4,hash21(rc+floor(uTime*(.7+rh*.8)+rh*9.)))*(1.-smoothstep(.12,.55,fwidth(vW.x)));
      col+=(env*2.2+vec3(.02,.026,.035))*ring*(1.-vData.w);   // splashes, except on floors that are under cover
    }
  } else {
    float u=abs(Nn.x)>.5?vW.z:vW.x, v=vW.y;
    float st=fract(seed*7.31);
    vec2 cs=st<.4?vec2(3.2,3.8):st<.7?vec2(6.4,3.6):st<.88?vec2(2.4,7.2):vec2(4.6,4.6);
    vec2 m =st<.4?vec2(.18,.24):st<.7?vec2(.05,.30):st<.88?vec2(.26,.07):vec2(.30,.30);
    vec2 q=vec2(u,v)/cs, id=floor(q), f=fract(q), fw=fwidth(q);
    float lod=1.-smoothstep(.22,.75,max(fw.x,fw.y));
    float mask=smoothstep(m.x-fw.x,m.x+fw.x,f.x)*smoothstep(m.x-fw.x,m.x+fw.x,1.-f.x)

function updateHud(){
  drawHealth();
  $('speed').firstChild.nodeValue=Math.round(car.speed*3.6);$('alt').firstChild.nodeValue=Math.round(car.y);
  drawMini();
  // city limit: the barrier sits 40 m past the point where the city starts pushing you back
  const toEdge=PLAY+40-Math.max(Math.abs(car.x),Math.abs(car.z)),ek=clamp(1-toEdge/260,0,1);
  $('edgeGlow').style.opacity=(ek*ek*.9).toFixed(2);
  const ew=$('edgeWarn');ew.style.opacity=ek>0?Math.min(1,ek*2).toFixed(2):'0';
  if(ek>0)ew.textContent='City limit 境界  '+Math.max(0,Math.round(toEdge))+' m — turn back';
  const mk=$('mark');
  if(!game.job){mk.style.display='none';return;}
  const p=game.phase==='pickup'?game.job.from:game.job.to,x=p.x,y=p.y+8,z=p.z;
  const cw=VP[3]*x+VP[7]*y+VP[11]*z+VP[15];let cx=(VP[0]*x+VP[4]*y+VP[8]*z+VP[12])/cw,cy=(VP[1]*x+VP[5]*y+VP[9]*z+VP[13])/cw;
  if(cw<0){cx=-cx;cy=-cy;}
  const m=Math.max(Math.abs(cx)/.9,Math.abs(cy)/.8);
  if(cw<0||m>1){const mm=Math.max(m,.0001);cx/=mm;cy/=mm;}
  mk.style.display='block';mk.style.transform=`translate(${((cx*.5+.5)*innerWidth).toFixed(1)}px,${((.5-cy*.5)*innerHeight).toFixed(1)}px)`;
  const d=Math.hypot(p.x-car.x,p.z-car.z),dy=p.y+6-car.y;
  mk.lastElementChild.textContent=Math.round(d)+' m '+(dy>12?'▲':dy<-12?'▼':'');
}

// what is around the cab: cover overhead, how open the space is, the nearest sign and barge, wind and gusts
function updateEnv(dt){
  env.probe++;
  if(env.probe%4===0){let cov=0;for(let k=6;k<=46;k+=8)if(insideSolid(car.x,car.y+k,car.z,0)){cov=1;break;}
    let walls=0;for(const d of [[28,0],[-28,0],[0,28],[0,-28]])if(insideSolid(car.x+d[0],car.y,car.z+d[1],0))walls++;
    env.coverT=cov;env.openT=clamp(1-walls/2,0,1);}
  if(env.probe%6===0){let best=1e9;const x=car.x,y=car.y,z=car.z;
    for(let i=0;i<signPos.length;i+=3){const dx=signPos[i]-x;if(dx>22||dx<-22)continue;const dzz=signPos[i+2]-z;if(dzz>22||dzz<-22)continue;const dy=signPos[i+1]-y,d=dx*dx+dy*dy+dzz*dzz;if(d<best)best=d;}
    env.signNear=Math.sqrt(best);
    let bb=1e9;for(const t of barges){if(Math.abs(t.y-y)>90)continue;const s=((t.s0+t.speed*time+HALF)%(2*HALF)+2*HALF)%(2*HALF)-HALF;
      const d=Math.hypot((t.axis===1?s:t.fixed)-x,t.y-y,(t.axis===1?t.fixed:s)-z);if(d<bb)bb=d;}
    env.bargeNear=bb;}
  env.cover+=(env.coverT-env.cover)*Math.min(1,dt*6);env.open+=(env.openT-env.open)*Math.min(1,dt*2);
  wind.x=6+9*Math.sin(time*.13)+5*Math.sin(time*.37+1);wind.z=2+7*Math.sin(time*.11+2);wind.dx+=wind.x*dt;wind.dz+=wind.z*dt;
  env.gust=clamp(.85+.3*Math.sin(time*.21)+.2*Math.sin(time*.53+2),.5,1.35);
  env.rainAmt=env.gust*(1-env.cover*.9);
  env.rush+=(((state==='play'&&inp.boost&&car.speed>62)?1:0)-env.rush)*Math.min(1,dt*3.5);
  // which way the water on the lens is being pushed: turning and sliding throw it sideways, climbing and diving up or down
  const vl=car.vx*Math.cos(car.yaw)-car.vz*Math.sin(car.yaw);
  const tfx=clamp(car.yr*.22+vl*.012,-1,1),tfy=clamp(-.09-car.vy*.012,-.6,.5),fk=Math.min(1,dt*5);
  flow.vx+=(tfx-flow.vx)*fk;flow.vy+=(tfy-flow.vy)*fk;
  flow.ax+=flow.vx*dt;flow.ay+=flow.vy*dt;flow.bx+=flow.vx*.3*dt;flow.by+=flow.vy*.3*dt;
}
function updateFx(dt){
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.t+=dt;if(s.t>s.life){sparks.splice(i,1);continue;}s.vy-=32*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;}
  if(state==='play'){const fx=Math.sin(car.yaw),fz=Math.cos(car.yaw),lx=Math.cos(car.yaw),lz=-Math.sin(car.yaw);
    trail.unshift([car.x-fx*2.75+lx*.8,car.y+.06,car.z-fz*2.75+lz*.8,car.x-fx*2.75-lx*.8,car.y+.06,car.z-fz*2.75-lz*.8,car.speed,env.rush>.4?1:0]);
    if(trail.length>22)trail.pop();}
  else if(trail.length)trail.length=0;
}
let last=performance.now(),fpsAcc=0,fpsN=0,autoQ=true,warm=0;
function frame(now){
  requestAnimationFrame(frame);
  const rawDt=Math.min(1,(now-last)/1000);let dt=Math.min(.05,rawDt);last=now;
  resize();
  readInput();
  if(menuLock>0)menuLock-=rawDt;
  if(uiOpen())menuPad(dt);
  if(state!=='paused'){
    time+=dt;
    if(state==='play'){updateCar(dt);updateJob(dt);if(state==='play'&&mode==='getaway')updateChase(dt);}
    else {car.vx*=.95;car.vz*=.95;car.vy*=.9;car.speed=Math.hypot(car.vx,car.vz);car.roll*=.95;car.pitch*=.95;}
    updateEnv(dt);updateFx(dt);
    if(state==='ending'&&performance.now()>=endT)finishShift();
    if(time>nextBolt){const bd=Math.random();flash=lerp(1,.3,bd);nextBolt=time+9+Math.random()*24;sfxThunder(bd);}
    flash=flash>0.02?flash*Math.exp(-dt*(4+6*Math.sin(time*31)*Math.sin(time*31))):0;
    shake=Math.max(shake-dt*3,env.rush*.07);hitFx=Math.max(0,hitFx-dt*2.2);
    if(toastT>0){toastT-=dt;if(toastT<=0)$('toast').classList.remove('on');}
  }
  updateCamera(dt);
  if(state==='play')updateHud();
  updateAudio();

  const model=carModel(),nDyn=fillDynamic(),nCh=fillChasers();
  gl.bindFramebuffer(gl.FRAMEBUFFER,T.refl.f);gl.viewport(0,0,T.refl.w,T.refl.h);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  renderScene(-1,nDyn,model,T.refl.h,nCh);
  gl.bindTexture(gl.TEXTURE_2D,T.refl.t);gl.generateMipmap(gl.TEXTURE_2D);
  gl.bindFramebuffer(gl.FRAMEBUFFER,T.scene.f);gl.viewport(0,0,RW,RH);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  renderScene(1,nDyn,model,RH,nCh);
  gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);
  fsPass(P.bright,T.a2,u=>bindTex(0,T.scene.t,u.uT));
  blur(T.a2,T.b2,1,0);blur(T.b2,T.a2,0,1);
  blur(T.a2,T.b4,1,0);blur(T.b4,T.a4,0,1);
  blur(T.a4,T.b8,2.6,0);blur(T.b8,T.a8,0,1);
  fsPass(P.post,null,u=>{bindTex(0,T.scene.t,u.uScene);bindTex(1,T.a2.t,u.uB2);bindTex(2,T.a4.t,u.uB4);bindTex(3,T.a8.t,u.uB8);
    gl.uniform1f(u.uTime,time);gl.uniform1f(u.uHit,hitFx);gl.uniform1f(u.uSpeed,car.speed);
    gl.uniform1f(u.uLens,[0,.42,1][SET.lens]*(1-env.cover*.85));gl.uniform1f(u.uRush,env.rush*SET.blur);gl.uniform1f(u.uAsp,RW/RH);gl.uniform1f(u.uMist,.7+.4*env.gust);
    gl.uniform2f(u.uFlowA,flow.ax,flow.ay);gl.uniform2f(u.uFlowB,flow.bx,flow.by);gl.uniform2f(u.uFlowV,flow.vx,flow.vy);});

  // on Auto, step the render scale down once or twice if the machine is struggling
  if(autoQ&&state==='play'){warm+=dt;if(warm>3){fpsAcc+=dt;fpsN++;if(fpsN>=90){const avg=fpsAcc/fpsN;fpsAcc=0;fpsN=0;
    if(avg>.027&&quality>.56){quality=quality>.9?.75:.55;resize();}}}}
}
addEventListener('resize',resize);
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();const f=$('fatal');f.style.display='flex';f.textContent='The graphics context was lost. Reload the page to keep driving.';});
applySettings();
setLamp('空車','Vacant','');
openRoot('main');
loadScores();
setTimeout(()=>$('fade').classList.add('out'),350);
window.__nrt={HS,car,game,cam,pads,traffic,tunnels,env,SET,sparks,flow,get scatter(){return scatterT;},menuKey:c=>menuKey({code:c,repeat:false,preventDefault(){}}),get menu(){return menuStack.slice();},get sel(){return sel;},togglePause,get time(){return time;},snap(){cam.x=car.x-Math.sin(car.yaw)*12.5;cam.y=car.y+4.2;cam.z=car.z-Math.cos(car.yaw)*12.5;},startGame,endShift,step(n){for(let i=0;i<n;i++){readInput();time+=1/60;if(state==='play'){updateCar(1/60);updateJob(1/60);if(state==='play'&&mode==='getaway')updateChase(1/60);}updateEnv(1/60);updateFx(1/60);}},chasers,vents:steamI.filter((v,i)=>i%48<3),get state(){return state;},stats:{instCount,signCount,ptCount,rCount,pads:pads.length,traffic:traffic.length}};
requestAnimationFrame(frame);
})();
